services:
  - type: web
    name: techpath-academy
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production

      # ── Payment Configuration ──
      # Set to "live" to accept real payments. Default is "demo" (simulated).
      - key: PAYMENT_MODE
        sync: false
      # Your site URL (needed for payment redirect URLs)
      # e.g. https://techpath-academy.onrender.com
      - key: SITE_URL
        sync: false
      # Currency code: KES, USD, ETB, etc.
      - key: CURRENCY
        sync: false

      # ── PayPal (international payments) ──
      # Get credentials: https://developer.paypal.com → My Apps & Credentials
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Set to "true" to use PayPal sandbox (for testing with fake accounts)
      - key: PAYPAL_SANDBOX
        sync: false

      # ── Flutterwave (Card + M-Pesa) ──
      # Get API keys: https://dashboard.flutterwave.com/dashboard/settings/apis
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_PUBLIC_KEY
        sync: false

      # ── Manual Payment Accounts (Telebirr / CBE) ──
      # These are shown to students at checkout — set your real account numbers
      - key: TELEBIRR_ACCOUNT
        sync: false
      - key: TELEBIRR_ACCOUNT_NAME
        sync: false
      - key: CBE_ACCOUNT
        sync: false
      - key: CBE_ACCOUNT_NAME
        sync: false

      # ── Admin contact email ──
      - key: ADMIN_EMAIL
        sync: false

      # ── Email / SMTP Configuration ──
      # Used for: welcome emails, payment receipts, course completion emails
      # Works with: Gmail, Outlook, Amazon SES, Brevo, SendGrid, Mailgun
      # Gmail example: SMTP_HOST=smtp.gmail.com SMTP_PORT=587 SMTP_USER=you@gmail.com SMTP_PASS=your-app-password
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

      # ── Security ──
      - key: NEXTAUTH_SECRET
        generateValue: true

      # ── Sentry error monitoring (free tier) ──
      # Client-side DSN is exposed to browser (safe — it's a public key)
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      # Server-side DSN (same value, used in sentry.server.config.ts)
      - key: SENTRY_DSN
        sync: false
      # Optional: for source map upload at build time (leave empty to skip)
      - key: SENTRY_AUTH_TOKEN
        sync: false

      # ── Google Analytics (optional) ──
      # Set to your GA4 Measurement ID (G-XXXXXXXXXX) to enable tracking
      - key: NEXT_PUBLIC_GA_ID
        sync: false
    disk:
      name: lms-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
